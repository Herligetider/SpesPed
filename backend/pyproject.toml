[project]
name = "spesped"
version = "0.1.0"
description = "Private school support modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "uvicorn>=0.34,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "pypdf>=6,<7",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
spesped = "spesped.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
